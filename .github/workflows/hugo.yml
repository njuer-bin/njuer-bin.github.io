name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.128.0'

      - name: Inject mailbox config
        run: |
          cat > static/js/mailbox-config.js << 'EOF'
          // 月光酒馆 - 信箱配置（自动生成，请勿手动修改）
          var MAILBOX_CONFIG = {
            githubToken: '${{ secrets.MAILBOX_GITHUB_TOKEN }}',
            githubRepo: 'njuer-bin/njuer-bin.github.io',
          };
          EOF

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4