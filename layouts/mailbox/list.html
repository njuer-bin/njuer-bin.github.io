{{ define "main" }}
<div class="page-container">
  <h1 class="page-title">✉️ 酒馆信箱</h1>
  <div class="page-content">
    <p>欢迎来到月光酒馆的信箱。你可以在这里给酒馆主人写信，也可以阅读其他访客的信件。</p>
  </div>

  <!-- 通知区域 -->
  <div id="notification" class="notification"></div>

  <!-- 写信入口 -->
  <div class="mailbox-write">
    <h2>📝 写一封信</h2>
    <form id="letterForm" class="letter-form">
      <div class="form-group">
        <label for="name">你的名字</label>
        <input type="text" id="name" name="name" placeholder="匿名访客" maxlength="20">
      </div>
      <div class="form-group">
        <label for="title">标题</label>
        <input type="text" id="title" name="title" placeholder="信件的标题" required maxlength="50">
      </div>
      <div class="form-group">
        <label for="message">内容</label>
        <textarea id="message" name="message" rows="6" placeholder="写下你想说的话..." required maxlength="2000"></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-send">📨 寄出</button>
    </form>
  </div>

  <!-- 已公开的信件 -->
  <div class="mailbox-letters">
    <h2>📖 已公开的信件</h2>
    <div id="lettersContainer">
      <div class="no-letters">
        <p>📬 正在加载信件...</p>
      </div>
    </div>
  </div>
</div>

<script src="/js/mailbox.js"></script>
{{ end }}
