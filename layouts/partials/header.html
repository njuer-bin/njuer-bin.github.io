<header class="tavern-header">
  <div class="header-content">
    <a href="/" class="tavern-sign">
      <h1 class="tavern-title">{{ .Site.Params.tavernName }}</h1>
      <p class="tavern-subtitle">{{ .Site.Params.tavernSubtitle }}</p>
    </a>
    <nav class="tavern-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link{{ if eq $.Page.RelPermalink .URL }} active{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
    </nav>
  </div>
</header>
